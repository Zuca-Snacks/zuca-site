<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Fonts are preloaded, not just @font-face'd, because both are used above
      the fold (Lazydog for the wordmark, Outfit for the promise line and the
      email field). crossorigin is required even for same-origin font preloads.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/lazydog-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/outfit-latin-var.woff2" crossorigin />

    <!--
      LCP preload. The hero <img>s are rendered by React, so they do not exist
      in this document and the browser's preload scanner cannot discover them —
      the requests would otherwise not start until the JS bundle had downloaded,
      parsed and mounted.

      BOTH hero products are preloaded, because the hero now shows two and they
      are the same rendered size, so either can win the LCP measurement. The
      chocolate one carries fetchpriority=high as the left-hand, first-painted
      element; the maple one is preloaded without it so it does not compete.

      ⚠️ These mirror the <picture> markup in Hero.jsx, including `sizes`. If the
      hero art direction changes, change these in the same commit — a preload
      pointing at an image the page no longer renders is worse than no preload:
      it downloads a file nobody uses AND leaves the real LCP undiscoverable.
      That is exactly what happened when the hero went from one photo to two.

      type="image/avif" means non-AVIF browsers skip the preload rather than
      fetching a format they cannot use.
    -->
    <link rel="preload" as="image" type="image/avif" fetchpriority="high"
          imagesrcset="/images/hero-flavours-420.avif 420w, /images/hero-flavours-780.avif 780w, /images/hero-flavours-1218.avif 1218w"
          imagesizes="100vw" />

    <meta name="theme-color" content="#FDE0B4" />

    <!--
      Marks that JS is alive, before first paint. The section-entrance animation
      hides its elements only under `.z-js`, so if this never runs (JS off, a
      crawler, a script error) the page renders fully visible instead of blank.
    -->
    <script>document.documentElement.classList.add('z-js');</script>

    <!--
      COPY OWNERSHIP: the conversion agent owns final wording. The previous
      title and description read "Physician-recommended fiber snacks", which the
      brief's health-claim guardrails forbid ("physician-recommended" is on the
      prohibited list). Replaced with the safe nutrient-content form. See
      HANDOFF-ux.md.
    -->
    <title>Zuca — 14g of fiber per serving, in a snack you'll look forward to</title>
    <meta name="description" content="Zuca turns upcycled apple pulp into snack bites. 14g of fiber and 180 calories per serving. Created by a Michelin-trained chef and a Stanford physician. Join the waitlist.">

    <meta property="og:title" content="Zuca — 14g of fiber per serving, in a snack you'll look forward to">
    <meta property="og:description" content="Snack bites made from upcycled apple pulp. Per serving: 14g fiber, 5g protein, 180 calories, no refined sugar.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://zucasnacks.com">

    <!--
      SHARE CARD. Until 8 Sep 2026 there was NO og:image at all, so every shared
      link rendered as a text-only card — including forwarded paid clicks.

      ⚠️ ABSOLUTE URL, NOT A PATH. Facebook, LinkedIn, Slack and iMessage fetch
      this from their own servers, where a relative path resolves against
      nothing. A relative og:image fails by showing no image, with no error.

      ⚠️ Keep og:image:width/height in step with the file. Several unfurlers lay
      out the card from these numbers BEFORE the image finishes downloading; if
      they disagree with the real file the card renders at the wrong shape.

      The file is composed by scripts/gen-images.mjs from the same two flavour
      crops the modals use, so a reshoot updates it in the same run. It carries
      no baked-in text: the title and description below are the words, they are
      claim-checked in copy, and text inside an image cannot be corrected without
      a re-export or read by a screen reader.
    -->
    <meta property="og:image" content="https://zucasnacks.com/images/og-card-1200.jpg">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Zuca chocolate raspberry sea salt bites and maple pecan bites, side by side.">

    <!-- summary_large_image, not summary: with a 1200x630 card the small square
         "summary" variant crops it to a thumbnail and wastes the photography. -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://zucasnacks.com/images/og-card-1200.jpg">
    <meta name="twitter:title" content="Zuca — 14g of fiber per serving, in a snack you'll look forward to">
    <meta name="twitter:description" content="Snack bites made from upcycled apple pulp. Per serving: 14g fiber, 5g protein, 180 calories, no refined sugar.">

    <!-- Privacy-friendly analytics by Plausible. Cookieless, no personal data,
         so no cookie banner and no consent surface.
         ⚠️ SITE-SPECIFIC URL — the domain is baked into the script, verified by
         reading it (it contains "zucasnacks.com"). Do NOT swap this for
         script.js + data-domain: that is the older SDK and would collect
         nothing here. async, not defer, per Plausible's snippet.
         The queue stub that belongs beside this lives in src/lib/analytics.js,
         because an inline <script> needs 'unsafe-inline' and this site's CSP
         does not grant it.
         ⚠️ Needs script-src AND connect-src to allow https://plausible.io — the
         script loads from there and the beacons POST to /api/event. Missing
         connect-src leaves the tag installed and every call reporting success
         while nothing is recorded. -->
    <script async src="https://plausible.io/js/pa-d8RUApAFPL7Dlz814Oip_.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
